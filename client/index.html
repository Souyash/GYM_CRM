<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300F59B'><path d='M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14l1.43 1.43L2 7.71l1.43 1.43L2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22l1.43-1.43L16.29 22l2.14-2.14 1.43 1.43 1.43-1.43-1.43-1.43L22 16.29z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>IronVault - Smart Gym CRM</title>
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="IronVault" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600;1,700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-dark-950 text-slate-100 antialiased font-poppins selection:bg-brand-primary selection:text-dark-950">
    <!-- Instant Native Preloader (Renders in 1ms before JS bundle loads) -->
    <div id="initial-preloader" style="position:fixed;inset:0;background:#070709;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:'Poppins',sans-serif;color:#ffffff;transition:opacity 0.4s ease;">
      <div style="position:relative;width:84px;height:84px;display:flex;align-items:center;justify-content:center;margin-bottom:22px;">
        <div style="position:absolute;inset:0;border-radius:24px;background:rgba(16,185,129,0.18);filter:blur(14px);animation:ivPulse 2s infinite ease-in-out;"></div>
        <div style="position:absolute;inset:-6px;border-radius:50%;border:1px dashed rgba(16,185,129,0.4);animation:ivSpin 8s infinite linear;"></div>
        <div style="position:relative;width:68px;height:68px;border-radius:20px;background:linear-gradient(135deg,#18181b,#09090b);border:2px solid rgba(16,185,129,0.6);box-shadow:0 0 25px rgba(16,185,129,0.3);display:flex;align-items:center;justify-content:center;">
          <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
      </div>
      <div style="font-size:22px;font-weight:900;letter-spacing:0.12em;margin-bottom:4px;">
        IRON<span style="color:#34d399;">VAULT</span>
      </div>
      <div style="font-size:10px;font-weight:700;letter-spacing:0.25em;color:rgba(52,211,153,0.8);text-transform:uppercase;margin-bottom:24px;">
        Smart Gym Operating System
      </div>
      <div style="width:160px;height:4px;background:#18181b;border-radius:99px;overflow:hidden;border:1px solid #27272a;">
        <div style="height:100%;width:50%;background:linear-gradient(90deg,#10b981,#34d399);border-radius:99px;animation:ivBar 1.2s infinite ease-in-out;"></div>
      </div>
      <style>
        @keyframes ivSpin{100%{transform:rotate(360deg)}}
        @keyframes ivPulse{0%,100%{opacity:0.3;transform:scale(0.95)}50%{opacity:0.7;transform:scale(1.08)}}
        @keyframes ivBar{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
      </style>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
