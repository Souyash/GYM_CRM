services:
  - type: web
    name: gym-crm-backend
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build && npm run seed
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5001
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: "*"
      - key: NODE_ENV
        value: production

